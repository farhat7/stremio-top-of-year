name: Build and publish

on:
  schedule:
    - cron: "30 3 * * *"   # daily, after IMDb refreshes its datasets
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          # Plot summaries come from TMDB, looked up by IMDb id. Optional:
          # without it the build still succeeds, just with no descriptions.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
